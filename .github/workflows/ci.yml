#
# Test CI. All tests are CPU-only (no GPU / torch / triton needed);
# the GPU harness + cudapy scorer are exercised only in the offline factory.
# Linting is owned by the internal (fbsource) linter, not this OSS mirror.

name: ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Test (pytest)
        run: pytest -q
