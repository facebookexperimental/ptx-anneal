#
# Build + publish ptx-anneal to PyPI.
#
# INERT BY DESIGN until publishability clears:
#   * The build job always runs (sanity: sdist + wheel build on tag / manual run).
#   * The publish job is GATED on the repo variable `PTX_ANNEAL_PUBLISH == 'true'`.
#     Until that variable is set in repo settings, NOTHING is pushed to PyPI even
#     on a tag. Do NOT set it until: (1) legal/marketing publishability sign-off is in,
#     and (2) `pip index versions ptx-anneal` confirms the name is free.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # GATE: stays off until this repo variable is explicitly set to 'true'.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PTX_ANNEAL_PUBLISH == 'true' }}
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC); no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
